<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeadFlow AI</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --line: #e3e6ea; --text: #1f2328; --muted: #59636e; --blue: #0969da;
    --green: #1a7f37; --green-bg: #dafbe1; --amber: #9a6700; --amber-bg: #fff8c5; --red: #cf222e;
    --red-bg: #ffebe9; --grey-bg: #eef0f2;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
         color: var(--text); background: var(--bg); }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px 40px; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 18px 0 10px; }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  button { font: inherit; cursor: pointer; border-radius: 8px; }
  .ghost { background: #fff; border: 1px solid var(--line); padding: 6px 12px; }
  .primary { background: var(--blue); color: #fff; border: 0; padding: 8px 16px; font-weight: 600; }
  button:disabled { opacity: .55; cursor: wait; }

  .scenarios { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; margin: 6px 0 16px; }
  .scenario { background: #fff; border: 1px solid var(--line); padding: 8px 10px; text-align: left; line-height: 1.25;
              font-size: 14px; }
  .scenario small { display: block; color: var(--muted); font-size: 12px; }
  .scenario.active { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue); }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; margin-bottom: 16px; }
  .card h2 { margin: 0 0 10px; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }

  .hero { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
  .hero .who { font-size: 22px; font-weight: 600; }
  .hero .arrow { font-size: 22px; color: var(--muted); }
  .hero .to { font-size: 22px; font-weight: 700; }
  .hero .time { margin-left: auto; color: var(--muted); }
  .why { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-block; padding: 2px 10px; border-radius: 12px; background: var(--grey-bg); font-size: 13px; }
  .chip.High, .chip.bad { background: var(--red-bg); color: var(--red); }
  .chip.Medium, .chip.warn { background: var(--amber-bg); color: var(--amber); }
  .chip.Low, .chip.good { background: var(--green-bg); color: var(--green); }
  .bw-High { background: var(--green-bg); color: var(--green); }
  .bw-Medium { background: var(--amber-bg); color: var(--amber); }
  .bw-Low { background: var(--red-bg); color: var(--red); }

  .steps { display: flex; align-items: center; margin-top: 16px; flex-wrap: wrap; row-gap: 6px; }
  .step { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 18px; background: var(--grey-bg);
          color: var(--muted); font-size: 14px; }
  .step .dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid currentColor; display: inline-flex;
               align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
  .step.passed { background: var(--green-bg); color: var(--green); }
  .step.decided { background: var(--amber-bg); color: var(--amber); font-weight: 600; }
  .step.running { color: var(--blue); background: #ddf4ff; }
  .step.running .dot { border-top-color: transparent; animation: spin 0.9s linear infinite; }
  .connector { width: 18px; height: 2px; background: var(--line); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .reason { margin-top: 10px; color: var(--muted); }

  .grid3 { display: grid; grid-template-columns: 1fr 1.15fr 1.15fr; gap: 16px; align-items: start; }
  .big { font-size: 40px; font-weight: 700; line-height: 1; }
  .rep { font-size: 26px; font-weight: 700; }
  ul.reasons { margin: 10px 0 0; padding-left: 18px; }
  ul.reasons li { margin: 3px 0; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
  th, td { text-align: left; padding: 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.pick { background: #ddf4ff; font-weight: 600; }
  tr.pick-backup { background: #f1f8ff; }
  .brief { white-space: pre-wrap; background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
           padding: 10px 12px; font-size: 13px; margin-top: 8px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  .note { margin-top: 8px; font-size: 13px; }
  details summary { cursor: pointer; color: var(--blue); font-size: 13px; margin-top: 10px; }
  details.msg { border-top: 1px solid var(--line); padding: 6px 0; }
  details.msg summary { color: var(--text); margin: 0; }
  pre.json { max-height: 420px; overflow: auto; font-size: 12px; background: var(--bg); padding: 10px; }

  .edit { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px 12px; }
  .edit label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 2px; }
  .edit .wide { grid-column: span 2; }
  .edit .full { grid-column: 1 / -1; }
  input, select, textarea { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; font: inherit;
                            font-size: 14px; background: #fff; }
  textarea { min-height: 56px; resize: vertical; }
  ul.errors { color: var(--red); margin: 8px 0 0; }
  .hidden { display: none; }
  @media (max-width: 1000px) {
    .grid3 { grid-template-columns: 1fr; } .edit { grid-template-columns: 1fr 1fr; }
    .scenarios { grid-template-columns: repeat(4, 1fr); }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>LeadFlow AI</h1>
      <p>Inbound lead in, the right rep out: checked, scored, routed, and handed off.</p>
    </div>
    <div class="row" style="margin: 0">
      <button id="edit-toggle" class="ghost" type="button">Edit lead</button>
      <button id="reset" class="ghost" type="button">Reset demo</button>
    </div>
  </header>

  <div id="scenarios" class="scenarios"></div>

  <div id="edit-panel" class="card hidden">
    <h2>Edit the lead</h2>
    <div class="row" style="margin: 0 0 10px">
      <select id="sample" style="max-width: 420px"></select>
    </div>
    <form id="form" class="edit"></form>
    <div class="row"><button id="send" class="primary" type="submit" form="form">Send lead</button></div>
  </div>

  <section id="result">
    <div class="card muted">Pick a scenario above to send a lead through the system.</div>
  </section>

  <details class="card" id="evals">
    <summary style="margin: 0">How we know it works</summary>
    <div id="eval-body" class="small muted" style="margin-top: 10px">Loading…</div>
  </details>
</div>

<script>
// Scenarios shown as buttons, in demo order. Each id is a sample from /demo/samples.
const SCENARIOS = [
  ["sub_8f92a1c4", "FinPay", "High urgency"],
  ["sub_5q99w3k2", "TravelPass", "Medium urgency"],
  ["sub_ex04q2w5", "Test bot", "dropped"],
  ["sub_ex01z9m2", "Student", "self-serve"],
  ["sub_demo_cust", "Customer", "owner kept"],
  ["sub_demo_twoown", "Two owners", "to RevOps"],
  ["sub_demo_dup", "Duplicate", "after FinPay"],
  ["sub_demo_pk", "No reps", "unmapped country"],
];
const ENUMS = {
  role: ["CXO", "VP", "Director", "Manager", "Contributor"],
  company_size: ["1-15", "16-100", "51-250", "101-500", "251-1000", "501-1000", "1001+"],
  inquiry_reason: [
    "I want to evaluate BeaconDesk for my organization",
    "I want to understand which BeaconDesk plan is right for me",
    "I want to buy licenses or upgrade",
    "I need a compliance plan",
  ],
};
const FIELDS = [
  ["first_name", "First name"], ["last_name", "Last name"], ["work_email", "Work email", "wide"],
  ["company", "Company", "wide"], ["role", "Role"], ["company_size", "Company size"],
  ["country", "Country"], ["state", "State (US only)"], ["phone_number", "Phone", "wide"],
  ["inquiry_reason", "Inquiry reason", "full"], ["free_text_note", "Note", "full"],
  ["submission_id", "Submission ID", "wide"], ["submitted_at", "Submitted at (UTC)", "wide"],
];
const STEPS = [
  ["check", "Check"], ["buyer", "Read buyer"], ["reps", "Check reps"], ["route", "Route"], ["assign", "Assign & notify"],
];
// Which step decided each triage outcome.
const DECIDED_AT = {
  dropped: "check", self_serve: "check", duplicate: "check", preserve_owner: "check", ownership_exception: "check",
  no_eligible_reps: "reps", new_prospect: "assign",
};
const HEADLINE = {
  dropped: "Dropped before any agent or rep saw it",
  self_serve: "Sent to self-serve",
  duplicate: "Duplicate of an earlier lead",
  preserve_owner: "Existing customer: owner kept",
  ownership_exception: "Ownership unclear: sent to RevOps",
  no_eligible_reps: "No eligible rep for this lead",
};
const NEXT_STATUS = { New: ["Working"], Working: ["Converted"], Escalated: ["Working"] };

let samples = [];
let last = null;  // { body, seconds } of the latest successful send
let timer = null;
let simulated = 0;  // minutes of pretend time already simulated for the current lead

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (key === "class") node.className = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else node.setAttribute(key, value);
  }
  for (const child of children.flat()) {
    if (child === null || child === undefined || child === false) continue;
    node.append(child instanceof Node ? child : String(child));
  }
  return node;
}

// ---------- lead form (hidden behind "Edit lead") ----------

function buildForm() {
  const form = document.getElementById("form");
  for (const [name, text, span] of FIELDS) {
    const input = ENUMS[name]
      ? el("select", { id: name }, ENUMS[name].map((v) => el("option", { value: v }, v)))
      : name === "free_text_note" ? el("textarea", { id: name }) : el("input", { id: name, type: "text" });
    form.append(el("div", { class: span || "" }, el("label", { for: name }, text), input));
  }
  form.addEventListener("submit", (e) => { e.preventDefault(); send(readForm()); });
}

function fillForm(lead) {
  for (const [name] of FIELDS) document.getElementById(name).value = lead[name] ?? "";
}

function readForm() {
  const lead = {};
  for (const [name] of FIELDS) {
    const value = document.getElementById(name).value.trim();
    if (value !== "") lead[name] = value;
    else if (name === "state" || name === "free_text_note") lead[name] = null;
  }
  return lead;
}

async function loadSamples() {
  samples = await (await fetch("/demo/samples")).json();
  const select = document.getElementById("sample");
  const groups = {};
  samples.forEach((s, i) => {
    groups[s.group] ??= el("optgroup", { label: s.group });
    groups[s.group].append(el("option", { value: i }, s.label));
  });
  select.append(...Object.values(groups));
  select.addEventListener("change", () => fillForm(samples[select.value].lead));

  const bar = document.getElementById("scenarios");
  for (const [id, title, hint] of SCENARIOS) {
    if (!samples.some((s) => s.lead.submission_id === id)) continue;
    bar.append(el("button", { class: "scenario", type: "button", "data-id": id, onclick: () => sendSample(id) },
      title, el("small", {}, hint)));
  }
  // A link like /#send=sub_8f92a1c4 picks that sample and sends it.
  const wanted = new URLSearchParams(location.hash.slice(1)).get("send");
  const first = samples.findIndex((s) => s.lead.submission_id === (wanted || SCENARIOS[0][0]));
  select.value = Math.max(0, first);
  fillForm(samples[select.value].lead);
  if (wanted) sendSample(wanted);
}

function sendSample(id) {
  const index = samples.findIndex((s) => s.lead.submission_id === id);
  if (index < 0) return;
  document.getElementById("sample").value = index;
  fillForm(samples[index].lead);
  document.querySelectorAll(".scenario").forEach((b) => b.classList.toggle("active", b.dataset.id === id));
  send(samples[index].lead);
}

// ---------- sending ----------

function setBusy(busy) {
  document.querySelectorAll(".scenario, #send, #reset").forEach((b) => { b.disabled = busy; });
}

async function send(lead) {
  setBusy(true);
  const started = performance.now();
  showWaiting(lead, started);
  try {
    const response = await fetch("/leads", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(lead),
    });
    const body = await response.json();
    clearInterval(timer);
    const seconds = (performance.now() - started) / 1000;
    if (response.status === 202) { last = { body, seconds }; simulated = 0; render(); }
    else showRejected(response.status, body);
  } catch (error) {
    clearInterval(timer);
    showRejected(0, { detail: [{ loc: ["request"], msg: String(error) }] });
  } finally {
    setBusy(false);
  }
}

function showWaiting(lead, started) {
  const clock = el("span", { class: "time" }, "0.0 s");
  const who = `${lead.first_name || ""} ${lead.last_name || ""}`.trim() || "Lead";
  document.getElementById("result").replaceChildren(el("div", { class: "card" },
    el("div", { class: "hero" }, el("span", { class: "who" }, `${who}${lead.company ? ", " + lead.company : ""}`),
      el("span", { class: "arrow" }, "→"), el("span", { class: "to muted" }, "routing…"), clock),
    stepStrip(null, true),
    el("div", { class: "reason" }, "Checking the lead, then Claude reads the note and picks a rep. This takes a few seconds.")));
  clearInterval(timer);
  timer = setInterval(() => { clock.textContent = `${((performance.now() - started) / 1000).toFixed(1)} s`; }, 100);
}

function showRejected(status, body) {
  const errors = (body.detail || []).map((e) => el("li", {}, `${(e.loc || []).slice(1).join(".") || "lead"}: ${e.msg}`));
  document.getElementById("result").replaceChildren(el("div", { class: "card" },
    el("div", { class: "hero" }, el("span", { class: "who" }, "Rejected by the form check"),
      el("span", { class: "chip bad" }, status || "error")),
    el("ul", { class: "errors" }, errors)));
}

// ---------- rendering ----------

function stepStrip(decidedAt, running = false, allPassed = false, good = false) {
  const index = STEPS.findIndex(([key]) => key === decidedAt);
  const parts = [];
  STEPS.forEach(([key, text], i) => {
    let cls = "step";
    if (running) cls += " running";
    else if (i < index || (allPassed && i === index)) cls += " passed";
    else if (i === index) cls += good ? " passed" : " decided";
    const mark = cls.includes("passed") ? "✓" : cls.includes("decided") ? "!" : "";
    if (i > 0) parts.push(el("span", { class: "connector" }));
    parts.push(el("span", { class: cls }, el("span", { class: "dot" }, mark), text));
  });
  return el("div", { class: "steps" }, parts);
}

function words(text) {
  return new Set((text || "").toLowerCase().split(/[^a-z0-9-]+/).filter(Boolean));
}

function whyChips(body, row) {
  const buyer = body.buyer;
  const chips = [el("span", { class: `chip ${buyer.urgency_tier}` }, `${buyer.urgency_tier} urgency · ${buyer.intent_score}`)];
  if (!row) return chips;
  if (buyer.detected_competitor && row.competitor_strengths.includes(buyer.detected_competitor)) {
    chips.push(el("span", { class: "chip" }, `strong vs ${buyer.detected_competitor}`));
  }
  const industry = words(buyer.firmographics && buyer.firmographics.industry);
  const match = row.vertical_expertise.find((v) => [...words(v)].some((w) => industry.has(w)));
  if (match) chips.push(el("span", { class: "chip" }, `${match} expertise`));
  chips.push(el("span", { class: `chip bw-${row.bandwidth_tier}` }, `${row.bandwidth_tier} bandwidth`));
  chips.push(el("span", { class: "chip" }, `${row.leads_remaining_today} leads left today`));
  return chips;
}

function render() {
  const { body, seconds } = last;
  const lead = body.lead;
  const a = body.assignment;
  const assigned = a && a.outcome === "assigned";
  const rows = body.capacity ? Object.fromEntries(body.capacity.reps.map((r) => [r.rep_id, r])) : {};
  const repRow = assigned ? rows[a.rep_id] : null;

  let target;
  if (body.status === "new_prospect") target = assigned ? a.rep_id : "RevOps queue";
  else if (body.assigned_rep_id) target = body.assigned_rep_id;
  else target = { dropped: "dropped", self_serve: "self-serve", ownership_exception: "RevOps", no_eligible_reps: "RevOps" }[body.status] || "—";

  const escalated = body.tracking && body.tracking.status === "Escalated";
  const reason = body.status !== "new_prospect" ? `${HEADLINE[body.status] || body.status}. ${body.reason}`
    : assigned ? body.reason
    : escalated ? "Escalated to RevOps by the SLA watchdog: no rep started work within the time limit."
    : "No shortlisted rep had a free slot today, so the lead went to RevOps.";

  const out = document.getElementById("result");
  out.replaceChildren(el("div", { class: "card" },
    el("div", { class: "hero" },
      el("span", { class: "who" }, `${lead.first_name} ${lead.last_name} (${lead.role}, ${lead.company})`),
      el("span", { class: "arrow" }, "→"), el("span", { class: "to" }, target),
      el("span", { class: "time" }, seconds < 0.1 ? "< 0.1 s" : `${seconds.toFixed(1)} s`)),
    body.buyer && el("div", { class: "why" }, whyChips(body, repRow)),
    stepStrip(DECIDED_AT[body.status], false, body.status === "new_prospect" && assigned, body.status === "preserve_owner"),
    el("div", { class: "reason" }, reason)));

  if (body.buyer) {
    out.append(el("div", { class: "grid3" }, buyerCard(body.buyer), matchCard(body), handoffCard(body)));
  } else if (body.tracking && body.tracking.messages.length) {
    out.append(handoffCard(body));
  }
  out.append(technicalDetails(body, seconds));
}

function buyerCard(buyer) {
  const top = buyer.score_breakdown.filter((l) => !["base", "cap"].includes(l.factor))
    .sort((x, y) => y.points - x.points).slice(0, 3);
  const all = buyer.score_breakdown.map((l) =>
    el("tr", {}, el("td", {}, l.detail), el("td", { class: "num" }, l.points > 0 ? `+${l.points}` : l.points)));
  return el("div", { class: "card" }, el("h2", {}, "Buyer"),
    el("div", { class: "row", style: "margin: 0" }, el("span", { class: "big" }, buyer.intent_score),
      el("span", { class: `chip ${buyer.urgency_tier}` }, `${buyer.urgency_tier} urgency`),
      buyer.detected_competitor && el("span", { class: "chip" }, buyer.detected_competitor)),
    buyer.note_summary && el("p", {}, `“${buyer.note_summary}”`),
    el("div", { class: "small muted" }, "Biggest reasons"),
    el("ul", { class: "reasons" }, top.map((l) => el("li", {}, `${l.detail} (+${l.points})`))),
    el("details", {}, el("summary", {}, "Full score breakdown"), el("table", {}, all)),
    el("div", { class: "small muted note" }, `Note read by ${buyer.extraction === "llm" ? "Claude" : "rules"}`));
}

function matchCard(body) {
  const a = body.assignment;
  const routing = body.routing;
  const primary = a && a.rep_id;
  const backup = a && a.backup_rep_id;
  const repRows = body.capacity.reps.map((r) => el("tr", { class: r.rep_id === primary ? "pick" : r.rep_id === backup ? "pick-backup" : "" },
    el("td", {}, r.rep_id, r.rep_id === primary ? " ★" : r.rep_id === backup ? " (backup)" : ""),
    el("td", {}, el("span", { class: `chip bw-${r.bandwidth_tier}` }, r.bandwidth_tier)),
    el("td", { class: "num" }, r.leads_remaining_today),
    el("td", {}, r.competitor_strengths.join(", "))));
  const fullRows = body.capacity.reps.map((r) => el("tr", {},
    el("td", {}, r.rep_id), el("td", {}, r.stage_pressure), el("td", { class: "num" }, r.meetings_today_hours),
    el("td", {}, r.vertical_expertise.join(", ")), el("td", {}, r.notes || "")));
  const how = routing.method === "llm" ? "Picked by Claude" : `Picked by the rule-based ranker (Claude: ${routing.llm_status})`;
  const moved = body.tracking && body.tracking.status_history.some((e) => e.actor === "watchdog");
  return el("div", { class: "card" }, el("h2", {}, "Rep match"),
    primary
      ? el("div", { class: "row", style: "margin: 0" }, el("span", { class: "rep" }, primary),
          backup && el("span", { class: "muted" }, `backup ${backup}`))
      : el("div", { class: "rep" }, "RevOps queue"),
    el("div", { class: "small muted" }, how, moved ? " · moved by the SLA watchdog" : ""),
    el("p", { class: "small" }, routing.proposal.routing_rationale),
    el("table", {}, el("tr", {}, ["Rep", "Bandwidth", "Left", "Strong against"].map((h) => el("th", {}, h))), repRows),
    el("details", {}, el("summary", {}, "All rep details"),
      el("table", {}, el("tr", {}, ["Rep", "Stage pressure", "Meetings h", "Expertise", "Load"].map((h) => el("th", {}, h))), fullRows)));
}

function handoffCard(body) {
  const t = body.tracking || { status: null, status_history: [], messages: [] };
  const brief = body.routing ? body.routing.proposal.rep_brief : (body.triage.ownership && body.triage.ownership.brief);
  const holder = t.assignment ? t.assignment.rep_id : body.assigned_rep_id;
  const statusCls = t.status === "Escalated" ? "warn" : t.status ? "good" : "";
  const nextMoves = holder || t.status === "Escalated" ? (NEXT_STATUS[t.status] || []) : [];
  const events = t.status_history.filter((e) => e.actor !== "system").map((e) =>
    el("li", {}, `${e.status}${e.rep_id ? " with " + e.rep_id : ""}: ${e.note || "by " + e.actor}`));
  const notices = t.messages.filter((m) => m.kind !== "assignment" && m.body !== brief);
  const recipient = holder || (t.messages[0] && t.messages[0].recipient);
  return el("div", { class: "card" }, el("h2", {}, "Handoff"),
    t.status && el("div", { class: "row", style: "margin: 0" },
      el("span", { class: `chip ${statusCls}` }, t.status), holder && el("span", {}, `with ${holder}`)),
    el("div", { class: "row" },
      nextMoves.map((s) => el("button", { class: "ghost", type: "button", onclick: () => setStatus(t.submission_id, s) }, `Mark ${s}`)),
      t.status === "New" && el("button", { class: "ghost", type: "button", onclick: () => simulate(11) },
        simulated ? "Simulate another 11 min" : "Simulate 11 min later")),
    el("div", { id: "sim-note", class: "small muted note" }),
    events.length > 0 && el("ul", { class: "reasons small" }, events),
    brief && el("div", { class: "small muted note" }, recipient ? `What ${recipient} received:` : "Brief:"),
    brief && el("div", { class: "brief" }, brief),
    notices.length > 0 && el("div", { class: "note small muted" }, "Other messages"),
    notices.map((m) => el("details", { class: "msg small" }, el("summary", {}, `To ${m.recipient}: ${m.subject}`),
      el("div", { class: "brief" }, m.body))));
}

function technicalDetails(body, seconds) {
  return el("details", { class: "card" }, el("summary", { style: "margin: 0" }, "Technical details"),
    el("p", { class: "small muted" }, `Submission ${body.submission_id} · status ${body.status} · ${seconds.toFixed(2)} s · `,
      el("a", { href: "/docs", target: "_blank" }, "API docs")),
    el("pre", { class: "json" }, JSON.stringify(body, null, 2)));
}

// ---------- actions ----------

async function refresh() {
  if (!last) return;
  const t = await (await fetch(`/leads/${last.body.submission_id}/tracking`)).json();
  const body = last.body;
  body.tracking = t;
  if (body.assignment && t.assignment) {
    body.assignment = { ...t.assignment, already_committed: body.assignment.already_committed };
    body.assigned_rep_id = t.assignment.rep_id;
  }
  render();
}

async function setStatus(submissionId, status) {
  const response = await fetch(`/leads/${submissionId}/status`, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ status }),
  });
  if (!response.ok) alert((await response.json()).detail);
  await refresh();
}

async function simulate(step) {
  simulated += step;
  const minutes = simulated;
  const report = await (await fetch(`/watchdog/run?minutes_ahead=${minutes}`, { method: "POST" })).json();
  const mine = report.actions.find((x) => last && x.submission_id === last.body.submission_id);
  await refresh();
  const text = !mine ? `${minutes} minutes later: still inside its time limit, nothing changes.`
    : mine.action === "reassigned" ? `${minutes} minutes later: ${mine.from_rep_id} had not started, so the lead moved to ${mine.to_rep_id}.`
    : mine.action === "escalated" ? `${minutes} minutes later: ${mine.reason} Escalated to RevOps.`
    : `${minutes} minutes later: overdue with ${mine.from_rep_id} (${mine.minutes_waiting} min); only High urgency is reassigned.`;
  const note = document.getElementById("sim-note");
  if (note) note.textContent = text;
}

async function resetDemo() {
  await fetch("/demo/reset", { method: "POST" });
  last = null;
  document.querySelectorAll(".scenario").forEach((b) => b.classList.remove("active"));
  document.getElementById("result").replaceChildren(
    el("div", { class: "card muted" }, "Demo reset: no assignments, messages, or status history. Pick a scenario to start."));
}

async function loadEvals() {
  const target = document.getElementById("eval-body");
  try {
    const summary = await (await fetch("/demo/eval-summary")).json();
    target.replaceChildren(
      el("p", { style: "margin-top: 0" }, `Offline checks on the 15 workbook leads (${summary.source}):`),
      el("ul", { class: "reasons" }, (summary.talking_points || []).map((p) => el("li", {}, p))));
  } catch (error) {
    target.textContent = "Evaluation summary unavailable.";
  }
}

buildForm();
document.getElementById("reset").addEventListener("click", resetDemo);
document.getElementById("edit-toggle").addEventListener("click", () =>
  document.getElementById("edit-panel").classList.toggle("hidden"));
loadSamples();
loadEvals();
</script>
</body>
